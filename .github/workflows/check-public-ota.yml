name: Check public NXT OTA downloads once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-public-ota.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect publisher-provided public update feeds
        shell: python
        run: |
          import json, urllib.request
          feeds = {
              "Stock": "1OUrxqAs2fOnjKeqZscGcMEiX5Yv3jP5m",
              "NextUI": "16OuNQmcxwLE3VTTN2bUyZ0yL2EiGFeuD",
              "NXRedux": "1rYgL1ao0wm3V8IEA_WxUTfJ-mstKG59r",
          }
          for rom, file_id in feeds.items():
              url = "https://drive.google.com/uc?export=download&id=" + file_id
              try:
                  with urllib.request.urlopen(url, timeout=45) as response:
                      data = response.read(1024*1024)
                  obj = json.loads(data)
                  selected = {}
                  def inspect(value, prefix=""):
                      if isinstance(value, dict):
                          for k,v in value.items():
                              path = prefix + "." + k if prefix else k
                              if isinstance(v, (dict,list)):
                                  inspect(v,path)
                              elif any(t in k.lower() for t in ("version","url","sha256","filename")):
                                  selected[path] = v
                      elif isinstance(value,list):
                          for i,v in enumerate(value):
                              inspect(v,prefix+"["+str(i)+"]")
                  inspect(obj)
                  print(json.dumps({"rom":rom,"public_feed":True,"metadata":selected},ensure_ascii=False))
              except Exception as e:
                  print(json.dumps({"rom":rom,"error":type(e).__name__,"detail":str(e)[:200]}))
