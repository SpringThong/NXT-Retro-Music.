name: Publish original NXT v1.9.7.7 release once
on:
  push:
    branches: [main]
    paths: ['.nxt-publish/ready']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'SpringThong/NXT-Retro-Music.' && github.event.head_commit.message == 'Publish original NXT Retro Music v1.9.7.7 publicly'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish original release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for rom in Stock NextUI NXRedux; do
            base64 --decode ".nxt-publish/$rom.recipe.json.gz.b64" > ".nxt-publish/$rom.recipe.json.gz"
          done
          python3 .nxt-publish/publish.py
