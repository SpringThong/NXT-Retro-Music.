name: Upload three original NXT installers once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/upload-public-installers.yml']
permissions:
  contents: write
jobs:
  upload:
    if: github.repository == 'SpringThong/NXT-Retro-Music.'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install public Google Drive download helper
        run: python3 -m pip install --disable-pip-version-check --quiet gdown==5.2.0
      - name: Verify original ZIPs and upload draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .release-publish/upload.py
